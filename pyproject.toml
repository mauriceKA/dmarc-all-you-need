[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarc-all-you-need"
version = "0.1.0"
description = "Minimal, beautiful, self-hostable DMARC aggregate report visualizer"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
dmarcayn = "dmarcayn.__main__:main"

[project.urls]
Homepage = "https://github.com/mauriceKA/dmarc-all-you-need"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
dmarcayn = ["static/**/*"]

[tool.ruff]
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests; src uses explicit raises anyway

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # dummy credentials in test fixtures

[tool.pytest.ini_options]
testpaths = ["tests"]
